# AHK-Linux-Bridge — Hyprland snippet (Hyprland 0.56+ Lua config)
# APPEND / SOURCE from your Hyprland config. Lua-config users: translate each
# line to hl.config() calls, or `source` this file from hyprland.conf if your
# setup still sources plain-conf snippets.
#
# What this gives a Linux AFK farmer:
#  - Wine/Proton game windows float at a fixed size (no tiling resizes ->
#    no device-reset flicker, stable click coordinates).
#  - One-key macros: SUPER+F1 runs the farm loop, SUPER+F2 the hello macro,
#    ESC stays free as the master abort key (see runtime ABORT_KEYS).

# --- Window rules: keep game + macro windows stable -----------------------
# Wine virtual-desktop outer window (class is explorer.exe, title "<Game> - Wine Desktop")
windowrule = float, class:^(explorer\.exe)$
windowrule = size 1280 720, class:^(explorer\.exe)$
windowrule = center, class:^(explorer\.exe)$
windowrule = noinitialfocus, class:^(explorer\.exe)$

# Common Wine/Proton game classes (lowercase exe names under Hyprland)
windowrule = float, class:^(robloxplayerbeta\.exe)$
windowrule = float, class:^(terraria\.exe)$
windowrule = float, class:^(.*\.exe)$

# Bridge terminal popups (MsgBox log tailers, record sessions)
windowrule = float, title:^(ahk-bridge.*)$

# --- Keybinds: SUPER+F1/F2 fire macros via the bridge ----------------------
# NOTE: bind SUPER+F1 (not bare F1) so in-game F1 keeps working; the bridge
# hotkey inside the script stays F1:: and is fired explicitly with --hotkey.
bind = SUPER, F1, exec, ahk-bridge run ~/macros/afk_farm_advanced.ahk --hotkey F1 --jitter 0.2
bind = SUPER, F2, exec, ahk-bridge run ~/macros/afk_farm_advanced.ahk --hotkey F2
bind = SUPER SHIFT, F1, exec, pkill -f "ahk-bridge run"  # emergency stop of looping runs

# Reload after editing: hyprctl reload
